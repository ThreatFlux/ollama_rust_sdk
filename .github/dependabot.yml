version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    allow:
      - dependency-type: all
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    labels:
      - dependencies
      - docker
