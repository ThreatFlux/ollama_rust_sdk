name: Auto Release

concurrency:
  # Dry runs use their own group so they never cancel a real release in progress.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
  queue: max

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release-candidate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run != true) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run the policy from the trusted revision that defines this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify proposal and candidate match
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/check_release_candidate.py

  release:
    needs: release-candidate
    if: >-
      !cancelled() &&
      (needs.release-candidate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@240529daaf569ee1f5b5e22f683b113ec4e1d62d # v0.7.13
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only workflow_dispatch can request a dry run; workflow_run releases are real.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      create-pr: true
      required-workflows: ci.yml,security.yml
      # The threatflux-automation GitHub App cuts the release, so its tag push
      # is an ordinary push that starts release.yml (v*.*.*) and docker.yml (v*)
      # through their `push: tags` triggers. The reusable workflow therefore
      # skips these dispatches on the App path (dispatch-on-app-token stays
      # false), so each workflow runs once per tag. They are only dispatched if
      # the release falls back to GITHUB_TOKEN, whose tag push starts nothing.
      dispatch-workflows: release.yml,docker.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
