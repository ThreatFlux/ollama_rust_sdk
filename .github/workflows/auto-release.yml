name: Auto Release

concurrency:
  # Dry runs use their own group so they never cancel a real release in progress.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only workflow_dispatch can request a dry run; workflow_run releases are real.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      required-workflows: ci.yml,security.yml
      # The threatflux-automation GitHub App cuts the release, so its tag push
      # is an ordinary push that starts release.yml (v*.*.*) and docker.yml (v*)
      # through their `push: tags` triggers. The reusable workflow therefore
      # skips these dispatches on the App path (dispatch-on-app-token stays
      # false), so each workflow runs once per tag. They are only dispatched if
      # the release falls back to GITHUB_TOKEN, whose tag push starts nothing.
      dispatch-workflows: release.yml,docker.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
