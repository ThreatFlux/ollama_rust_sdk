name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE_VERSION: 1.99.0

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master commit
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Report formatting issues
        if: failure()
        run: |
          echo "::error::Code formatting issues detected. Run 'cargo fmt' to fix."
          cargo fmt --all -- --check --verbose

  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master commit
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy (errors)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run clippy (pedantic)
        continue-on-error: true
        run: cargo clippy --all-features --all-targets -- -W clippy::pedantic

  complexity:
    name: Code Complexity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install scc
        run: |
          curl --fail --location --retry 3 --output scc.tar.gz https://github.com/boyter/scc/releases/download/v4.1.0/scc_Linux_x86_64.tar.gz
          echo "c7328436d3027f4357d3d7853f7dc3ac2bbcb4ca08f1adad91a27c593884079b  scc.tar.gz" | sha256sum --check --strict
          tar -xzf scc.tar.gz
          chmod +x scc

      - name: Code complexity analysis
        run: |
          {
            echo "## Code Complexity Report"
            echo '```'
            ./scc --sort complexity src/
            echo '```'
            echo "## Lines of Code"
            echo '```'
            ./scc src/ examples/ tests/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master commit
        with:
          toolchain: nightly

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked --version 0.1.61

      - name: Check for unused dependencies
        run: cargo +nightly udeps --all-features
