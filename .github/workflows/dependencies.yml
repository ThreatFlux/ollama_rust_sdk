name: Dependencies

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.0

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    # This job executes build scripts and tests from freshly updated crates, so
    # it only gets a read-only GITHUB_TOKEN and never sees the PR-creation token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master commit
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked --version 0.19.0

      - name: Update dependencies
        run: |
          cargo update
          cargo outdated --exit-code 1 || true

      - name: Test with updated dependencies
        run: |
          cargo test --all-features
          cargo build --all-features

      - name: Upload updated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

  create-pull-request:
    name: Create Dependency Update PR
    needs: update-dependencies
    runs-on: ubuntu-latest
    # create-pull-request pushes and opens the PR; this job runs no dependency
    # code. The write permissions are only used when it falls back to
    # GITHUB_TOKEN (see "Create Pull Request" below).
    permissions:
      contents: write # push the deps/weekly-update branch
      pull-requests: write # open or update the dependency PR
    env:
      # The `secrets` context is not available to a step-level `if:`, so the
      # presence of the App key is surfaced here and the steps branch on it.
      HAS_DEPS_APP_PRIVATE_KEY: ${{ secrets.DEPS_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download updated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-cargo-lock
          path: .

      # A PR opened with GITHUB_TOKEN is authored by github-actions[bot] and its
      # pull_request runs wait at action_required until a maintainer approves
      # them. When the optional GitHub App is configured (DEPS_APP_CLIENT_ID
      # variable + DEPS_APP_PRIVATE_KEY secret), its installation token opens
      # the PR instead so CI starts automatically. The token is limited to this
      # repository with contents and pull-requests write. Without the App the
      # workflow falls back to GITHUB_TOKEN. The org GIT_TOKEN PAT is not used
      # because it fails authentication (HTTP 401).
      - name: Validate dependency App configuration
        if: (vars.DEPS_APP_CLIENT_ID == '') != (env.HAS_DEPS_APP_PRIVATE_KEY == 'false')
        run: |
          echo "::error::DEPS_APP_CLIENT_ID and DEPS_APP_PRIVATE_KEY must be configured together"
          exit 1

      - name: Create GitHub App token
        id: app-token
        if: vars.DEPS_APP_CLIENT_ID != '' && env.HAS_DEPS_APP_PRIVATE_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          add-paths: Cargo.lock
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): weekly dependency updates"
          body: |
            ## Weekly Dependency Updates

            This PR contains the latest dependency updates.

            ### Checklist
            - [ ] All tests pass
            - [ ] No breaking changes
            - [ ] Security advisories addressed
          branch: deps/weekly-update
          delete-branch: true

  check-outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # pinned master commit
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked --version 0.19.0

      - name: Check outdated dependencies
        run: |
          echo "## Outdated Dependencies Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo outdated >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
