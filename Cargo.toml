[package]
name = "ollama_rust_sdk"
version = "0.1.5"
edition = "2024"
rust-version = "1.97.1"
description = "Async Rust client and CLI for supported Ollama API endpoints"
license = "MIT"
repository = "https://github.com/ThreatFlux/ollama_rust_sdk"
homepage = "https://github.com/ThreatFlux/ollama_rust_sdk"
documentation = "https://threatflux.github.io/ollama_rust_sdk/"
readme = "README.md"
keywords = ["ollama", "ai", "llm", "sdk", "rust"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "ollama_rust_sdk"
path = "src/lib.rs"

[[bin]]
name = "ollama-cli"
path = "src/main.rs"

[dependencies]
# HTTP client and async runtime
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error handling
thiserror = "2.0.19"

# URL parsing
url = "2.5.8"

# Async streaming
futures-util = "0.3.33"

# CLI support
clap = { version = "4.6.5", features = ["derive"] }
env_logger = "0.11.10"
log = "0.4.30"

# Additional dependencies for examples
chrono = { version = "0.4.44", features = ["serde"] }

# Optional: TLS support
rustls = { version = "0.23.39", optional = true }

# Optional: Tracing support
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
tokio-test = "0.4.5"
wiremock = "0.6.5"
tempfile = "3.27.0"
mockall = "0.15.0"
rstest = "0.26.1"
assert-json-diff = "2.0.2"
pretty_assertions = "1.4.1"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[features]
default = ["tls"]
tls = ["reqwest/rustls", "dep:rustls"]
tracing = ["dep:tracing"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
